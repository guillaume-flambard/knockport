[package]
name = "knockport-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
knockport-core = { path = "../core" }
dioxus = { version = "0.8.0-alpha.1", features = ["web"] }
serde = { workspace = true }
serde_json = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Performance", "Headers", "RequestInit", "Response"] }
wasm-bindgen = "0.2"
